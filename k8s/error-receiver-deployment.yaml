apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-error-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cards-error-receiver
  template:
    metadata:
      labels:
        app: cards-error-receiver
    spec:
      containers:
      - name: error-receiver
        image: oci.smeago.com:5000/cards-error-receiver:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3