apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cards-testing
  template:
    metadata:
      labels:
        app: cards-testing
    spec:
      containers:
      - name: cards
        image: oci.smeago.com:5000/test-canyon-cards:latest
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5