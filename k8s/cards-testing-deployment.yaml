apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cards-testing
  template:
    metadata:
      labels:
        app: cards-testing
    spec:
      containers:
      - name: cards
        image: oci.smeago.com:5000/cards-testing:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5